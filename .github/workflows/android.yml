name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --debug

    - name: Upload APK to Release
      if: github.event_name == 'push' || github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/*.apk
        tag_name: ${{ github.event.release.tag_name || format('v{0}', github.run_number) }}
        name: ${{ github.event.release.name || format('Release v{0}', github.run_number) }}
        body: |
          New build of Claw App.
          Download the APK below to install on your Android device.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
